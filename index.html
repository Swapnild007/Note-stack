self:start}.sidebar a{display:block;padding:12px 6px;color:#4e675a;font-size:13px}.reader{background:white;border:1px solid #e7eeea;border-radius:15px;padding:35px;line-height:1.8}.reader h1{font-size:36px;line-height:1.2}.concept{background:#f0f8f4;border:1px solid #dcefe5;padding:25px;border-radius:13px;margin:24px 0}.diagram{display:flex;align-items:center;justify-content:space-around;gap:10px;flex-wrap:wrap}.node{background:white;border:2px solid #b3dcca;border-radius:12px;padding:16px;font-weight:750}.code{background:#092f38;color:#d2f5e9;padding:22px;border-radius:12px;white-space:pre-wrap;font-family:monospace;overflow:auto}.quiz button{display:block;width:100%;text-align:left;background:white;border:1px solid #dce7e1;padding:13px;margin:8px 0;border-radius:9px}.footer{padding:35px 0;border-top:1px solid #e4eae6;color:#77877f}.empty{padding:30px;text-align:center}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.links{display:none}.hero-grid{grid-template-columns:1fr}.illustration{min-height:280px}.course,.lesson{grid-template-columns:1fr}}@media(max-width:580px){.hero{padding:35px 0}.hero h1{letter-spacing:-1.4px}.illustration{min-height:240px}.bubble{font-size:12px;padding:12px}.cards{grid-template-columns:1fr}.stats{margin-top:25px}.stats div{padding:12px}.stats strong{font-size:18px}.section{padding:36px 0}.search{flex-wrap:wrap}.search input{width:100%}.search .btn{width:100%}.reader{padding:20px}.course h1{font-size:32px}}

const specs=[["Playwright Testing","Web Development","🎭","#008b79","#71d9c2"],["Frontend Development","Web Development","💻","#5140a4","#a7a0ff"],["C++ Programming","Programming","⌨️","#105aa0","#83c8fa"],["Data Science","Data & AI","📈","#07886b","#7fe3bd"],["Python Programming","Programming","🐍","#205a9b","#a2d2ff"],["JavaScript","Web Development","⚡","#a46a09","#f9da7b"],["HTML & CSS","Web Development","🎨","#c35754","#ffbeb5"],["React","Web Development","⚛️","#2d73aa","#a1dffa"],["TypeScript","Web Development","🔷","#265d9b","#b1cafa"],["Node.js","Web Development","🟢","#187749","#a2e2a7"],["Next.js","Web Development","▲","#34404b","#a9b4be"],["SQL","Data & AI","🗄️","#35758b","#9bd4d9"],["DBMS","Computer Science","🧮","#6650a0","#c7b7f7"],["Data Structures","Computer Science","🧩","#6b4da4","#d6baf5"],["Algorithms","Computer Science","🔎","#a0587d","#efb8d5"],["Operating Systems","Computer Science","🖥️","#475c83","#b5c7ea"],["Computer Networks","Computer Science","🌐","#127d8c","#8ad8de"],["System Design","Computer Science","🏗️","#755a40","#e4c9a2"],["Machine Learning","Data & AI","🧠","#5c54ac","#c2baf4"],["Deep Learning","Data & AI","🤖","#59459e","#c9aaf4"],["Generative AI","Data & AI","✨","#9d5caa","#efc2ef"],["AI Agents","Data & AI","🦾","#248c80","#a2e9d8"],["Cybersecurity","Security","🛡️","#187467","#a4e0c5"],["Ethical Hacking","Security","🔐","#3b5b70","#9bc7d8"],["Linux","DevOps","🐧","#6c6354","#e5d6a9"],["Git & GitHub","DevOps","🌿","#446c57","#b2dcbf"],["Docker","DevOps","📦","#2379a0","#a8d9f2"],["Kubernetes","DevOps","☸️","#435eab","#b1c5fa"],["Cloud Computing","DevOps","☁️","#4584a5","#b3e1f4"],["AWS Foundations","DevOps","🌩️","#b77d3a","#f6d6a3"],["UI/UX Design","Design","🖌️","#a0507d","#f1badb"],["Figma","Design","🎛️","#7b51a2","#d9baf0"],["Excel Analytics","Analytics","📊","#137954","#a0e1b8"],["Power BI","Analytics","📉","#b58c1c","#f8e49b"],["Power Automate","Automation","🔁","#5a66ae","#b7c3f3"],["Workforce Management","Operations","🎯","#167d7c","#99dfd5"]];const courses=specs.map((s,i)=>({id:i,title:s[0],cat:s[1],icon:s[2],a:s[3],b:s[4],modules:["Foundations and core concepts","Essential tools and techniques","Applied workflows","Intermediate patterns","Advanced applications","Capstone and review"]}));const app=document.getElementById('app');let category='All',query='';const key='notestack-progress-v1';const progress=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};const card=c=>'<a href="'+(c.id===0?'./playwright-academy.html#/first-browser-test':'#/course/'+c.id)+'" class="card"><div class="art" style="--a:'+c.a+';--b:'+c.b+'">'+c.icon+'</div><div class="cardbody"><h3>'+c.title+'</h3><p>Explore concepts, illustrated notes and practical applications in '+c.title+'.</p></div><footer>◈ '+c.modules.length+' module outlines · Introductory notes</footer></a>';function catalog(home){const cats=['All','Web Development','Programming','Computer Science','Data & AI','Design','DevOps','Security','Analytics','Automation','Operations'];const filtered=courses.filter(c=>(category==='All'||c.cat===category)&&c.title.toLowerCase().includes(query.toLowerCase()));return (home?'<section class="hero"><div class="wrap"><div class="hero-grid"><div><span class="kicker">✦ Built for curious learners</span><h1>Visual notes that make <em>skills actually stick.</em></h1><p>Explore illustrated explanations, structured courses, hands-on practice and practical projects. Learn one concept at a time.</p><div class="search"><input id="q" aria-label="Search courses" placeholder="What do you want to learn?" value="'+query+'"><button class="btn" id="find">Search</button></div><div class="chips"><a class="chip" href="#/course/6">Web Development</a><a class="chip" href="#/course/13">Data Structures</a><a class="chip" href="#/course/12">DBMS</a><a class="chip" href="#/course/18">AI & ML</a></div></div><div class="illustration" aria-label="Decorative visual learning illustration"><div class="bubble one">🧠 AI & Ideas</div><div class="bubble two">💻 Build with code</div><div class="hero-icon">👩‍💻</div><div class="bubble three">📊 Data insights</div></div></div><div class="stats"><div><strong>36</strong><span>Course outlines</span></div><div><strong>6</strong><span>Modules per course</span></div><div><strong>Free</strong><span>Learn at your pace</span></div></div></div></section>':'')+'<section class="section"><div class="wrap"><h2>Every course, one library</h2><p class="muted">Explore structured courses across development, computer science, AI, design, security and operations.</p><div class="filters">'+cats.map(x=>'<button data-cat="'+x+'" class="filter '+(x===category?'active':'')+'">'+x+'</button>').join('')+'</div><div class="search"><input id="q" aria-label="Filter courses" placeholder="Search all 36 courses..." value="'+query+'"><button class="btn" id="find">Filter</button></div><p class="muted" id="count">Showing '+filtered.length+' of 36 courses</p><div class="cards" id="cards">'+filtered.map(card).join('')+'</div></div></section>'}function detail(c){return '<div class="wrap"><div class="crumb"><a href="#/courses">All courses</a> / '+c.title+'</div><div class="course"><div><div class="art" style="--a:'+c.a+';--b:'+c.b+';height:210px">'+c.icon+'</div><h1>'+c.title+'</h1><p class="muted">Learn foundational concepts through a guided progression, worked examples and applied practice.</p><div class="panel"><h2>Course syllabus</h2><p class="muted">Six planned modules. Modules are planned. Only explicitly linked published lessons are available; remaining content is being authored.</p>'+c.modules.map((m,i)=>'<details class="module"><summary>Module '+(i+1)+': '+m+'</summary><a href="#/learn/'+c.id+'/'+i+'">Module not yet published →</a></details>').join('')+'</div></div><aside><div class="panel"><h3>Start learning</h3><p class="muted">Self-paced · 6 planned modules</p><a class="btn" style="display:block;text-align:center" href="#/learn/'+c.id+'/0">Start course →</a></div></aside></div></div>'}function reader(c,i){const m=c.modules[i];return '<div class="wrap"><div class="crumb"><a href="#/course/'+c.id+'">'+c.title+'</a> / '+m+'</div><section class="section"><div class="panel" style="max-width:720px;margin:auto"><span style="color:#149e74;font-weight:750;font-size:12px">CURRICULUM IN DEVELOPMENT</span><h1>'+m+'</h1><p class="muted">This module has not been authored or reviewed yet. We are not publishing generic filler as a completed lesson.</p><a class="btn" style="display:inline-block" href="#/course/'+c.id+'">Return to course outline →</a>'+(c.id===0?'<p><a href="./playwright-academy.html#/first-browser-test">Read the published Playwright lesson →</a></p>':'')+'</div></section></div>'}function render(){const p=(location.hash.slice(2)||'').split('/'),c=courses[Number(p[1])];if(p[0]==='course'&&c)app.innerHTML=detail(c);else if(p[0]==='learn'&&c&&Number(p[2])>=0&&Number(p[2])<6){if(c.id===0){location.replace('./playwright-academy.html#/'+['first-browser-test','locators-and-assertions','navigation-and-waiting','forms-and-errors','debugging-tests','capstone'][Number(p[2])]);return;}app.innerHTML=reader(c,Number(p[2]));}else if(p[0]==='progress'){const n=Object.values(progress()).filter(Boolean).length;app.innerHTML='<section class="section wrap"><h1>My Learning</h1><p class="muted">'+n+' module introductions completed on this device. Your progress is stored in this browser.</p><a class="btn" href="#/courses">Explore courses</a></section>'}else if(p[0]==='paths')app.innerHTML='<section class="section wrap"><h1>Learning paths</h1><p class="muted">Suggested starting sequences.</p><div class="cards">'+[["Web Developer",6],["Data Analyst",32],["AI Engineer",4],["WFM Analyst",35]].map(x=>'<a class="card" style="padding:24px" href="#/course/'+x[1]+'"><h3>'+x[0]+'</h3><p>Start your journey →</p></a>').join('')+'</div></section>';else app.innerHTML=catalog(p[0]!=='courses');window.scrollTo(0,0)}document.addEventListener('click',e=>{const f=e.target.closest('[data-cat]');if(f){category=f.dataset.cat;app.innerHTML=catalog(location.hash!=='#/courses')}if(e.target.id==='find'){query=document.getElementById('q').value;location.hash='#/courses';render()}const a=e.target.closest('[data-answer]');if(a)document.getElementById('feedback').textContent=a.dataset.answer==='1'?'Correct. Apply and verify your understanding.':'Try again: practice and verification matter.';const done=e.target.closest('[data-complete]');if(done){const p=progress();p[done.dataset.complete]=true;localStorage.setItem(key,JSON.stringify(p));render()}});document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;const cards=document.getElementById('cards');if(cards){const filtered=courses.filter(c=>(category==='All'||c.cat===category)&&c.title.toLowerCase().includes(query.toLowerCase()));cards.innerHTML=filtered.map(card).join('');document.getElementById('count').textContent='Showing '+filtered.length+' of 36 courses'}}});window.addEventListener('hashchange',render);render();
</script></body></html>
