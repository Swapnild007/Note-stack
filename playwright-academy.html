<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteStack · Playwright Academy</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f9f7;color:#182a2a;font:16px/1.75 system-ui,-apple-system,sans-serif}a{color:#078d66;text-decoration:none}button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:15px max(20px,calc((100vw - 1180px)/2));background:#fff;border-bottom:1px solid #e3ebe6}header strong{font-size:21px}header strong span{color:#129c72}.layout{max-width:1180px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px}.sidebar,.paper{background:#fff;border:1px solid #e1eae5;border-radius:15px}.sidebar{padding:20px;align-self:start;position:sticky;top:20px}.sidebar h2{font-size:19px;line-height:1.3}.sidebar button{display:block;width:100%;text-align:left;border:0;border-radius:9px;background:transparent;padding:12px 9px;color:#486155}.sidebar button.active{background:#e9f8f0;color:#087a58;font-weight:750}.sidebar button:disabled{opacity:.55;cursor:not-allowed}.paper{padding:clamp(22px,5vw,52px);min-height:600px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:1px;color:#078d66;text-transform:uppercase}h1{font-size:clamp(32px,4.6vw,48px);letter-spacing:-1.5px;line-height:1.15}h2{margin-top:38px;line-height:1.3}p,li{color:#52655b}.lead{font-size:19px}.concept{border:1px solid #d6eadd;background:#f0f9f4;border-radius:15px;padding:22px;margin:25px 0}.diagram{display:grid;grid-template-columns:1fr 25px 1fr 25px 1fr;gap:8px;align-items:center;text-align:center}.node{background:#fff;border:2px solid #a9d9c0;border-radius:11px;padding:14px 5px;min-height:100px}.node b,.node small{display:block}.node small{color:#687b6f;font-size:12px;line-height:1.4}.arrow{font-size:24px;color:#098d66}pre{background:#082f39;color:#d6f5e9;border-radius:12px;padding:20px;overflow:auto;font:13px/1.7 ui-monospace,monospace}code{background:#eaf2ed;padding:2px 5px;border-radius:4px}.callout{border-left:4px solid #139c73;background:#edf8f2;padding:16px 20px;margin:24px 0}.answers button{display:block;width:100%;text-align:left;border:1px solid #dce8df;border-radius:10px;background:white;padding:13px;margin:9px 0}.answers button:focus-visible{outline:3px solid #159c72}.primary{background:#149e75;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:750}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.secondary{border:1px solid #d7e6dc;background:#fff;border-radius:9px;padding:13px 18px}.muted{font-size:13px;color:#74837b}.meter{height:7px;background:#e7eee9;border-radius:10px;overflow:hidden}.meter i{display:block;background:#149d73;height:100%}@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{position:static}.diagram{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.paper{padding:23px}}.lab{background:#f1f9f4;border:1px solid #cfe6d9;border-radius:14px;padding:20px;margin:26px 0}.lab h2{margin-top:0}.lab .mock{background:white;border:1px solid #d8e6df;border-radius:10px;padding:16px;margin:14px 0}.lab .mock button{border:1px solid #c8ded2;border-radius:8px;background:white;padding:10px 14px;margin:5px}.lab .mock .save{background:#159e74;color:white}.lab select{width:100%;padding:12px;border:1px solid #bfd7ca;border-radius:8px;background:white;color:#19352a}.lab .result{font-weight:650;min-height:30px}.lab .muted{margin-bottom:0}.lab .secondary{margin-top:12px}</style></head><body><header><a href="./index.html" style="color:inherit"><strong>▧ Note<span>Stack</span></strong></a><a href="./index.html#/courses">All courses ↗</a></header><main class="layout"><aside class="sidebar"><div class="eyebrow">Course 01 · Web development</div><h2>🎭 Playwright Testing</h2><div class="meter"><i id="meter" style="width:0"></i></div><p id="progress" class="muted"></p><div id="navigation"></div></aside><article class="paper" id="lesson" aria-live="polite"></article></main><script>
const lessons=[
{id:'first-browser-test',title:'Write your first browser test',eyebrow:'Lesson 01 · Foundations',lead:'A browser test follows a user journey and proves that the application behaves as expected.',sections:[
{title:'Why browser testing matters',body:'A unit test checks a small piece of logic. An end-to-end browser test checks what a person can actually do on the page. A sign-in function might work correctly while the sign-in button is hidden or disabled. Browser testing catches failures across the visible interaction.'},
{title:'The Arrange → Act → Assert model',body:'First open the page and establish the starting state. Next perform a meaningful action. Finally assert that the expected result is visible. A test that only clicks a button has not proved that anything worked.',diagram:[['Arrange','Open the page'],['Act','Interact as a user'],['Assert','Check the outcome']]},
{title:'Your first TypeScript test',body:'Initialize Playwright with npm init playwright@latest in a Node.js project. Save this example in tests/home.spec.ts and run npx playwright test. The example.com page is a public demonstration site.',code:"import { test, expect } from '@playwright/test';\n\ntest('example page has a heading', async ({ page }) => {\n  await page.goto('https://example.com');\n  await expect(page.getByRole('heading', {\n    name: 'Example Domain'\n  })).toBeVisible();\n});"},
{title:'Apply the idea',body:'Choose a page with a search field. Identify the input, the action and the result you expect. Write the assertion first, then the steps needed to reach that outcome.'}],checkpoint:'Why is asserting that a heading appears stronger than simply checking that page.goto completed?',question:'Which action makes a browser script a meaningful test?',options:['Click a button and stop','Assert an observable result after the action','Wait five seconds without checking'],correct:1},
{id:'locators-and-assertions',title:'Reliable locators and assertions',eyebrow:'Lesson 02 · Reliable tests',lead:'Choose elements by their accessible meaning, not their accidental position in the page.',sections:[
{title:'Why CSS position selectors break',body:'A selector such as button:nth-child(2) depends on the arrangement of the HTML. Inserting another button can redirect the test to the wrong control. A semantic locator expresses the intention of the user instead.'},
{title:'From intent to verification',body:'Identify what the user wants to do, locate the control by its role or label, and assert that the expected change occurs. This separates meaningful behavior from decorative styling.',diagram:[['Intent','Save changes'],['Locator','Button named Save'],['Assertion','Success status appears']]},
{title:'Prefer accessible locators',body:'Roles and accessible names usually produce readable, stable tests. Labels work well for inputs. Test IDs can help when no meaningful semantic alternative exists.',code:"const save = page.getByRole('button', { name: 'Save changes' });\nconst email = page.getByLabel('Email address');\nconst chart = page.getByTestId('revenue-chart');"},
{title:'Scope ambiguous elements',body:'When multiple Delete buttons exist, first locate the row or card that contains the relevant record. Then locate the Delete button inside it.',code:"const row = page.getByRole('row', { name: /Quarterly report/ });\nawait row.getByRole('button', { name: 'Delete' }).click();"},
{title:'Assert instead of sleeping',body:'Playwright web-first assertions retry supported conditions while waiting for the expected state. Prefer checking a confirmation message to adding arbitrary timeouts.',code:"await page.getByRole('button', { name: 'Save changes' }).click();\nawait expect(page.getByRole('status')).toContainText('Profile updated');"}],checkpoint:'Why does a role-based locator survive a CSS redesign better than a selector based on element position?',question:'How should a test verify an asynchronous save?',options:['Sleep a fixed five seconds','Assert the success status appears','Inspect only the button color'],correct:1},
{id:'navigation-and-waiting',title:'Navigation, waiting and page state',eyebrow:'Lesson 03 · User journeys',lead:'Reliable navigation tests wait for the right state, not an arbitrary number of milliseconds.',sections:[
{title:'A page is more than its URL',body:'A route may change before all relevant content appears. Checking only the address bar can miss a broken page. Pair URL assertions with a visible landmark, such as the destination heading.'},
{title:'A resilient navigation flow',body:'Locate the link by its accessible name, click it, and assert both destination URL and meaningful page content.',diagram:[['Click','Open courses'],['Route','URL changes'],['Ready','Heading visible']]},
{title:'Test a route transition',body:'This example assumes your app has a Courses link and an All courses heading. Adapt the route and names to match your own application.',code:"import { test, expect } from '@playwright/test';\n\ntest('opens the course catalogue', async ({ page }) => {\n  await page.goto('http://localhost:4173/');\n  await page.getByRole('link', { name: 'Courses' }).click();\n  await expect(page).toHaveURL(/courses/);\n  await expect(page.getByRole('heading', {\n    name: 'All courses'\n  })).toBeVisible();\n});"},
{title:'Avoid arbitrary delays',body:'A fixed timeout can be too short on slow machines and unnecessarily long on fast ones. Instead, use an assertion on the specific state that signals readiness. Consider network responses only when they are genuinely part of the behavior under test.'}],checkpoint:'A link changes the URL but the destination remains blank. Which additional assertion catches this failure?',question:'What is the strongest way to verify navigation?',options:['Assert only that the click returned','Assert the destination URL and visible content','Always wait exactly ten seconds'],correct:1},
{id:'forms-and-errors',title:'Forms, validation and error states',eyebrow:'Lesson 04 · Practical flows',lead:'A complete form test covers both the successful path and the experience when something goes wrong.',sections:[
{title:'Test behavior, not just submission',body:'Filling a field and clicking Submit does not prove the form worked. Assert that the user receives a meaningful confirmation or reaches the intended destination.'},
{title:'Three useful scenarios',body:'Start with valid input, then test missing required input and invalid format. Each scenario should have an explicit expected result.',diagram:[['Valid','Confirmation'],['Missing','Required error'],['Invalid','Format error']]},
{title:'A validation example',body:'The example assumes an Email address input, a Subscribe button and an error message for invalid addresses.',code:"test('rejects an invalid email', async ({ page }) => {\n  await page.goto('http://localhost:4173/subscribe');\n  await page.getByLabel('Email address').fill('not-an-email');\n  await page.getByRole('button', { name: 'Subscribe' }).click();\n  await expect(page.getByText('Enter a valid email')).toBeVisible();\n});"},
{title:'Avoid shared test state',body:'Tests should not depend on another test having run first. Establish the required starting conditions within each test, and clean up any data that would affect subsequent runs.'}],checkpoint:'Why should a sign-up test check both valid and invalid email input?',question:'Which assertion is most meaningful after invalid input?',options:['The Submit button exists','A specific validation message appears','The page background is white'],correct:1},
{id:'debugging-tests',title:'Debugging flaky tests',eyebrow:'Lesson 05 · Troubleshooting',lead:'A flaky test passes and fails without a meaningful application change. Learn to diagnose the source rather than hiding it with retries.',sections:[
{title:'Separate application failures from test failures',body:'An application defect produces a real incorrect outcome. A test defect may target the wrong element, depend on shared state, or assume a timing condition that is not guaranteed. Inspect the failure evidence before changing either.'},
{title:'Follow the evidence',body:'Reproduce the failure, inspect the trace or screenshot, identify the missing condition, and fix the underlying cause. Blindly adding retries can conceal defects.',diagram:[['Reproduce','Find failure'],['Inspect','Trace + screenshot'],['Fix','Remove cause']]},
{title:'Use Playwright trace viewer',body:'Run tests with tracing enabled on retry or configure tracing in playwright.config.ts. Open a recorded trace with npx playwright show-trace path/to/trace.zip. The trace helps reveal actions, DOM snapshots and timing.',code:"// playwright.config.ts\nimport { defineConfig } from '@playwright/test';\nexport default defineConfig({\n  retries: 1,\n  use: { trace: 'on-first-retry' }\n});"},
{title:'Common causes',body:'Look for unstable selectors, state shared between tests, test data collisions, animation timing, external dependencies and missing assertions. Fix each at its source rather than adding longer sleeps.'}],checkpoint:'A test passes alone but fails when run with the full suite. What shared state or data dependencies would you investigate?',question:'What is the best first response to a flaky test?',options:['Add a ten-second delay everywhere','Inspect failure evidence and reproduce','Delete the assertion'],correct:1},
{id:'capstone',title:'Capstone: test a course catalogue',eyebrow:'Lesson 06 · Project',lead:'Combine navigation, locators, assertions and error-path thinking into a small, maintainable browser test suite.',sections:[
{title:'Project brief',body:'Test a course catalogue with search and category filters. Cover initial rendering, searching for Python, filtering by category and a no-results state. The project should remain reliable when card colors or positions change.'},
{title:'Design your coverage',body:'Start by listing each user action and its observable result. Each test should be independently runnable and should verify a single meaningful journey.',diagram:[['Arrange','Open catalogue'],['Act','Search Python'],['Assert','Python visible']]},
{title:'Example search test',body:'This test targets the current NoteStack catalogue served by a local static server on port 4173.',code:"import { test, expect } from '@playwright/test';\n\ntest('filters courses by name', async ({ page }) => {\n  await page.goto('http://localhost:4173/#/courses');\n  await page.getByRole('textbox', {\n    name: 'Filter courses'\n  }).fill('Python');\n  await expect(page.getByRole('heading', {\n    name: 'Python Programming'\n  })).toBeVisible();\n  await expect(page.getByRole('heading', {\n    name: 'Playwright Testing'\n  })).toHaveCount(0);\n});"},
{title:'Completion checklist',body:'Run the tests repeatedly, verify each assertion matches user-visible behavior, check an empty-search result, and document any assumptions about labels or routes. Do not mark the project complete until the suite runs reliably on your machine.'}],checkpoint:'If the Python result appears but unrelated cards remain visible, which assertion catches the incomplete filter?',question:'What makes the capstone ready to share?',options:['It contains many lines of code','Tests pass reliably and cover expected outcomes','It uses complex CSS selectors'],correct:1}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const store='notestack-progress-v2';function read(){try{return JSON.parse(localStorage.getItem(store)||'{}')}catch{return {}}}function migrate(){const p=read();if(localStorage.getItem('notestack-playwright-lesson-01'))p['first-browser-test']=true;if(localStorage.getItem('notestack-playwright-lesson-02'))p['locators-and-assertions']=true;localStorage.setItem(store,JSON.stringify(p))}migrate();function labHtml(id){if(id!=='locators-and-assertions')return '';return '<section class="lab" aria-label="Interactive locator lab"><div class="eyebrow">Interactive engineering lab</div><h2>Can your locator survive a UI change?</h2><p>Choose a locator strategy, then insert a new button before Save. A brittle position-based selector will target the wrong control.</p><label for="strategy"><strong>Locator strategy</strong></label><select id="strategy"><option value="position">button:nth-child(2) (position-based)</option><option value="role">getByRole(\\'button\\', { name: \\'Save changes\\' }) (semantic)</option></select><div class="mock" id="mock"><strong>Profile editor</strong><p class="muted">Imagine this interface is under automated test.</p><button>Cancel</button><button class="save">Save changes</button></div><button class="secondary" id="insert-button">Insert a new button</button> <button class="primary" id="run-locator">Run locator</button><p class="result" id="lab-result" role="status" aria-live="polite">Choose a strategy and run the locator.</p><p class="muted">This is a deterministic teaching simulation, not an actual Playwright execution environment. Run the code examples in a real Playwright project for end-to-end verification.</p></section>'}function wireLab(){const mock=document.getElementById('mock');if(!mock)return;let inserted=false;document.getElementById('insert-button').addEventListener('click',()=>{if(inserted)return;const b=document.createElement('button');b.textContent='Preview';mock.insertBefore(b,mock.querySelector('.save'));inserted=true;document.getElementById('lab-result').textContent='The interface changed. Run your locator again.'});document.getElementById('run-locator').addEventListener('click',()=>{const strategy=document.getElementById('strategy').value;const buttons=Array.from(mock.querySelectorAll('button'));const target=strategy==='role'?buttons.find(b=>b.textContent.trim()==='Save changes'):buttons[1];document.getElementById('lab-result').textContent=target&&target.textContent.trim()==='Save changes'?'✓ Correct target: Save changes.':'✗ Wrong target: '+(target?target.textContent.trim():'no match')+'. Try the semantic locator.'})}function render(){let id=decodeURIComponent(location.hash.slice(2)||'first-browser-test');let index=lessons.findIndex(x=>x.id===id);if(index<0){index=0;id=lessons[0].id}const l=lessons[index],p=read();document.getElementById('navigation').innerHTML=lessons.map((x,i)=>'<button class="'+(i===index?'active':'')+'" data-lesson="'+esc(x.id)+'">'+(p[x.id]?'✓ ':'○ ')+(i+1)+'. '+esc(x.title)+'</button>').join('');document.getElementById('progress').textContent=lessons.filter(x=>p[x.id]).length+' of '+lessons.length+' lessons complete';document.getElementById('meter').style.width=(100*lessons.filter(x=>p[x.id]).length/lessons.length)+'%';document.getElementById('lesson').innerHTML='<div class="eyebrow">'+esc(l.eyebrow)+'</div><h1>'+esc(l.title)+'</h1><p class="lead">'+esc(l.lead)+'</p>'+l.sections.map(s=>'<section><h2>'+esc(s.title)+'</h2><p>'+esc(s.body)+'</p>'+(s.diagram?'<figure class="concept"><div class="diagram">'+s.diagram.map((n,i)=>'<div class="node"><b>'+esc(n[0])+'</b><small>'+esc(n[1])+'</small></div>'+(i<2?'<span class="arrow">→</span>':'')).join('')+'</div><figcaption class="muted">Original NoteStack learning diagram</figcaption></figure>':'')+(s.code?'<pre>'+esc(s.code)+'</pre>':'')+'</section>').join('')+'<div class="callout"><strong>Practice checkpoint</strong><p>'+esc(l.checkpoint)+'</p></div><section><h2>Knowledge check</h2><p>'+esc(l.question)+'</p><div class="answers">'+l.options.map((o,i)=>'<button data-answer="'+i+'">'+esc(o)+'</button>').join('')+'</div><p id="feedback" role="status"></p></section><div class="controls"><button class="primary" id="complete">Mark lesson complete ✓</button>'+(index>0?'<button class="secondary" data-lesson="'+lessons[index-1].id+'">← Previous</button>':'')+(index<lessons.length-1?'<button class="secondary" data-lesson="'+lessons[index+1].id+'">Next lesson →</button>':'')+'</div><p class="muted" id="save-status">'+(p[l.id]?'✓ Completed on this device':'Progress is saved on this device')+'</p>';wireLab();document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const ok=Number(b.dataset.answer)===l.correct;document.getElementById('feedback').textContent=ok?'✓ Correct. '+l.options[l.correct]:'Try again. Revisit the explanation above.'}));document.getElementById('complete').addEventListener('click',()=>{const p=read();p[l.id]=true;localStorage.setItem(store,JSON.stringify(p));render()});document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>{location.hash='#/'+b.dataset.lesson}));document.title=l.title+' · NoteStack'}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
