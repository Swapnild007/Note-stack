<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course roadmap · NoteStack</title><style>*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:#1c302b;font:15px/1.75 system-ui,sans-serif}header{background:white;border-bottom:1px solid #e2ece5;padding:16px max(20px,calc((100vw - 980px)/2));display:flex;justify-content:space-between}a{color:#078c65;text-decoration:none}header strong{font-size:20px;color:#1b2c28}header strong em{color:#139e74;font-style:normal}main{max-width:980px;margin:35px auto;padding:0 20px}.eyebrow{color:#128b69;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:800}h1{font-size:clamp(32px,5vw,48px);line-height:1.15;letter-spacing:-1.4px}p{color:#596d62}.intro{background:white;border:1px solid #e1eae5;border-radius:16px;padding:clamp(20px,4vw,36px)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;margin-top:22px}.panel{background:white;border:1px solid #e1eae5;border-radius:15px;padding:25px}.module{display:flex;align-items:flex-start;gap:13px;border-bottom:1px solid #edf2ee;padding:18px 0}.module:last-child{border:0}.number{background:#eaf7ef;color:#148a66;border-radius:9px;padding:6px 11px;font-weight:800}.module h3{margin:0}.module p{margin:3px 0;font-size:13px}.cta{display:inline-block;background:#149d73;color:white;border-radius:9px;padding:11px 17px;font-weight:750}.source{overflow-wrap:anywhere;font-size:13px}.note{border-left:3px solid #159f74;background:#f0f8f3;padding:14px 17px;margin-top:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{padding:20px}}</style></head><body><header><a href="./index.html"><strong>▧ Note<em>Stack</em></strong></a><a href="./index.html#courses">All courses ↗</a></header><main id="root"></main><script src="./curriculum-research.js"></script><script>const params=new URLSearchParams(location.search);const c=(window.NOTE_STACK_CURRICULUM||[]).find(x=>x.slug===params.get('course'));const esc=s=>String(s).replace(/[&<>"]/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[v]));if(!c){document.getElementById('root').innerHTML='<div class="intro"><h1>Course not found</h1><a href="./index.html#courses">Return to catalogue</a></div>'}else{document.title=c.title+' · NoteStack roadmap';const published=c.slug==='playwright'?'./playwright-academy.html':c.slug==='data-structures'?'./dsa-arrays-linear-search.html':null;document.getElementById('root').innerHTML='<div class="intro"><div class="eyebrow">'+esc(c.category)+' / Research-aligned syllabus</div><h1>'+esc(c.icon)+' '+esc(c.title)+'</h1><p>Original NoteStack curriculum roadmap informed by the reference listed below. This page shows the planned subject sequence; it does not imply that every lesson has been written.</p>'+(published?'<a class="cta" href="'+published+'">Open interactive learning experience →</a>':'<span class="eyebrow">Lessons in development</span>')+'</div><div class="grid"><div class="panel"><h2>Course learning sequence</h2>'+c.modules.map((m,i)=>'<div class="module"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><h3>'+esc(m)+'</h3><p>Planned learning unit · Original explanations, examples and activities pending editorial review</p></div></div>').join('')+'</div><aside class="panel"><h2>Research reference</h2><p>This source informs the course scope and technical expectations. Its content is not reproduced or represented as an endorsed partnership.</p><p><strong>'+esc(c.source.name)+'</strong></p><a class="source" href="'+esc(c.source.url)+'" target="_blank" rel="noopener noreferrer">View official learning resource ↗</a><div class="note"><strong>Publishing status</strong><p>'+(published?'An interactive NoteStack experience is available. The full syllabus is not yet complete.':'Syllabus mapped. Full lessons and assessments are not yet published.')+'</p></div></aside></div>'}</script></body></html>
